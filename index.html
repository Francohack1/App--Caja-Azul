<body>

<div id="app">
  <div id="pantalla" class="gate">

      <div class="eyebrow">Caja Azul</div>
      <h1 class="h-lg">Conectando…</h1>
    </div>
  </div>
  <div id="main" class="hidden"></div>
</div>

<nav class="tabs hidden" id="nav">

    <button data-tab="registrar" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Registrar</button>
    <button data-tab="historial" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Historial</button>
    <button data-tab="arqueo" type="button">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Arqueo</button>
    <button data-tab="ajustes" type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>Ajustes</button>
  </div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
// El service worker es lo que hace que la app abra sin conexión.
// Solo funciona sobre https (GitHub Pages lo es) o en localhost.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
